<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <!-- Верхняя часть корпуса -->
  <g id="body-shell" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 18 112 C 18 164 22 214 27 254 C 46 265 98 271 160 271 C 222 271 274 265 293 254 C 298 214 302 164 302 112" fill="none" stroke-width="2.5" />
    <!-- Световые рефлексы на боковых гранях -->
    <path d="M 33 148 C 36 184 39 218 43 248" fill="none" stroke-width="1.1" stroke-opacity="0.28" />
    <path d="M 287 148 C 284 184 281 218 277 248" fill="none" stroke-width="1.1" stroke-opacity="0.28" />
  </g>

  <!-- Верхняя панель без внутреннего объёма -->
  <g id="top-panel" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- Внешний контур крышки -->
    <path d="M 18 112 C 18 68 78 52 160 52 C 242 52 302 68 302 112 C 302 156 242 172 160 172 C 78 172 18 156 18 112 Z" fill="none" stroke-width="2.5" />
    <!-- Нижняя кромка крышки (стык с тканью) -->
    <path d="M 18 119 C 24 162 82 179 160 179 C 238 179 296 162 302 119" fill="none" stroke-width="1.7" stroke-opacity="0.75" />
    
    <!-- Центральный круг (одиночный контур) -->
    <ellipse cx="160" cy="111" rx="62" ry="22" fill="none" stroke-width="2.2" />
  </g>

  <!-- Сенсорные кнопки крупным планом -->
  <g id="controls" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- Сердечко внутри центрального круга (одиночный контур) -->
    <path d="M 160 106.5 C 155.5 101 142.5 102 142.5 109.5 C 142.5 116 154.5 120.5 160 124 C 165.5 120.5 177.5 116 177.5 109.5 C 177.5 102 164.5 101 160 106.5 Z" fill="none" stroke-width="2.1" />

    <!-- Минус слева -->
    <line x1="48" y1="111" x2="72" y2="111" stroke-width="2.8" />
    <!-- Плюс справа -->
    <line x1="248" y1="111" x2="272" y2="111" stroke-width="2.8" />
    <line x1="261.5" y1="104.5" x2="258.5" y2="117.5" stroke-width="2.6" />
    <!-- Волна сверху -->
    <path d="M 143 74 C 147 66 151 65 155 69 C 158 72 162 72 165 69 C 169 65 173 66 177 74" fill="none" stroke-width="2.6" />
    <!-- Индикатор микрофона снизу -->
    <ellipse cx="160" cy="150" rx="15" ry="5.2" fill="none" stroke-width="2.3" />
    <ellipse cx="160" cy="150" rx="10" ry="3.2" fill="none" stroke-width="1" stroke-opacity="0.35" />
  </g>
</svg>