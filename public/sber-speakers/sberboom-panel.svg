<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <!-- Бочкообразная верхняя часть корпуса -->
  <g id="body-shell" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 160 34 C 78 34 32 68 32 138 L 35 256 C 58 269 106 275 160 275 C 214 275 262 269 285 256 L 288 138 C 288 68 242 34 160 34 Z" fill="none" stroke-width="2.5" />
  </g>

  <!-- Верхняя панель с кнопками -->
  <g id="top-panel" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="160" cy="74" rx="92" ry="36" fill="none" stroke-width="2.4" />
  </g>

  <!-- Сенсорные кнопки на верхней панели -->
  <g id="controls" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- Минус слева -->
    <line x1="92" y1="74" x2="112" y2="74" stroke-width="2.6" />
    <!-- Плюс справа -->
    <line x1="208" y1="74" x2="228" y2="74" stroke-width="2.6" />
    <line x1="219.5" y1="67.5" x2="216.5" y2="80.5" stroke-width="2.4" />
    
    <!-- Выключение микрофона сверху -->
    <rect x="157" y="48" width="6" height="9.5" rx="3" fill="none" stroke-width="1.9" />
    <path d="M 152.5 55 C 152.5 58.8 155.8 61 160 61 C 164.2 61 167.5 58.8 167.5 55" fill="none" stroke-width="1.8" />
    <line x1="160" y1="61" x2="160" y2="64" stroke-width="1.8" />
    <line x1="155" y1="64" x2="165" y2="64" stroke-width="1.8" />
    <line x1="151" y1="49" x2="169" y2="62" stroke-width="2" />
    
    <!-- Круглая кнопка Салют снизу -->
    <ellipse cx="160" cy="94" rx="11" ry="4.4" fill="none" stroke-width="2.1" />
  </g>

  <!-- Плавные 3D-ламели (рёбра корпуса), стартующие строго от контура эллипса -->
  <g id="acoustic-ribs" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- Центральная ламель (y = 110 — нижняя точка эллипса) -->
    <path d="M 156.5 110 L 156.5 262" fill="none" stroke-width="2" />
    <path d="M 163.5 110 L 163.5 262" fill="none" stroke-width="2" />
    
    <!-- Левые ламели (точки старта вычислены строго на кривой эллипса) -->
    <path d="M 134 108.5 C 131 126 131 158 131 260" fill="none" stroke-width="2" />
    <path d="M 140 109.1 C 137 127 137 158 137 261" fill="none" stroke-width="1.2" stroke-opacity="0.45" />

    <path d="M 110 104.3 C 103 122 103 156 103 257" fill="none" stroke-width="2" />
    <path d="M 116 105.6 C 109 124 109 156 109 258" fill="none" stroke-width="1.2" stroke-opacity="0.45" />

    <path d="M 88 96.4 C 75 114 75 150 75 251" fill="none" stroke-width="2" />
    <path d="M 94 98.9 C 81 117 81 150 81 253" fill="none" stroke-width="1.2" stroke-opacity="0.45" />

    <path d="M 73 86.2 C 53 102 52 140 52 243" fill="none" stroke-width="2" />

    <!-- Правые ламели (зеркально, строго от контура эллипса) -->
    <path d="M 186 108.5 C 189 126 189 158 189 260" fill="none" stroke-width="2" />
    <path d="M 180 109.1 C 183 127 183 158 183 261" fill="none" stroke-width="1.2" stroke-opacity="0.45" />

    <path d="M 210 104.3 C 217 122 217 156 217 257" fill="none" stroke-width="2" />
    <path d="M 204 105.6 C 211 124 211 156 211 258" fill="none" stroke-width="1.2" stroke-opacity="0.45" />

    <path d="M 232 96.4 C 245 114 245 150 245 251" fill="none" stroke-width="2" />
    <path d="M 226 98.9 C 239 117 239 150 239 253" fill="none" stroke-width="1.2" stroke-opacity="0.45" />

    <path d="M 247 86.2 C 267 102 268 140 268 243" fill="none" stroke-width="2" />
  </g>
</svg>