<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <!-- Верхняя часть вытянутого тканевого корпуса -->
  <g id="body-shell" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 160 32 C 80 32 36 64 36 130 L 39 256 C 62 269 108 275 160 275 C 212 275 258 269 281 256 L 284 130 C 284 64 240 32 160 32 Z" fill="none" stroke-width="2.5" />
  </g>

  <!-- Анимируемое LED-кольцо вокруг сенсорного диска -->
  <g id="led-ring" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- Внешний край тканевого валика -->
    <ellipse cx="160" cy="84" rx="94" ry="36" fill="none" stroke-width="2.2" />
    <!-- Световое LED-кольцо (подсветка) -->
    <ellipse cx="160" cy="86" rx="84" ry="31.5" fill="none" stroke-width="2.8" />
    <!-- Внутренний край сенсорного диска -->
    <ellipse cx="160" cy="87.5" rx="76" ry="28" fill="none" stroke-width="1.5" stroke-opacity="0.75" />
  </g>

  <!-- Сенсорные кнопки крупным планом -->
  <g id="controls" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
    <!-- Минус слева -->
    <line x1="98" y1="87.5" x2="116" y2="87.5" stroke-width="2.5" />
    <!-- Плюс справа -->
    <line x1="204" y1="87.5" x2="222" y2="87.5" stroke-width="2.5" />
    <line x1="214.5" y1="81.5" x2="211.5" y2="93.5" stroke-width="2.3" />
    
    <!-- Выключение микрофона сверху -->
    <rect x="157.3" y="64" width="5.4" height="8.5" rx="2.7" fill="none" stroke-width="1.8" />
    <path d="M 153 70.5 C 153 73.8 156 75.8 160 75.8 C 164 75.8 167 73.8 167 70.5" fill="none" stroke-width="1.7" />
    <line x1="160" y1="75.8" x2="160" y2="78.5" stroke-width="1.7" />
    <line x1="155.5" y1="78.5" x2="164.5" y2="78.5" stroke-width="1.7" />
    <line x1="151.5" y1="65" x2="168.5" y2="76.5" stroke-width="1.9" />
    
    <!-- Круглая кнопка Салют снизу (без галочки) -->
    <ellipse cx="160" cy="106" rx="10" ry="4" fill="none" stroke-width="2" />
  </g>

  <!-- Текстура вертикальных граней аудио-ткани ниже бортика -->
  <g id="fabric-texture" stroke="currentColor" stroke-linecap="round" stroke-opacity="0.3">
    <line x1="56" y1="124" x2="58" y2="252" stroke-width="1.4" />
    <line x1="76" y1="134" x2="77" y2="257" stroke-width="1.5" />
    <line x1="98" y1="141" x2="99" y2="261" stroke-width="1.6" />
    <line x1="122" y1="146" x2="122" y2="264" stroke-width="1.7" />
    <line x1="147" y1="148" x2="147" y2="265" stroke-width="1.8" />
    <line x1="173" y1="148" x2="173" y2="265" stroke-width="1.8" />
    <line x1="198" y1="146" x2="198" y2="264" stroke-width="1.7" />
    <line x1="222" y1="141" x2="221" y2="261" stroke-width="1.6" />
    <line x1="244" y1="134" x2="243" y2="257" stroke-width="1.5" />
    <line x1="264" y1="124" x2="262" y2="252" stroke-width="1.4" />
  </g>
</svg>